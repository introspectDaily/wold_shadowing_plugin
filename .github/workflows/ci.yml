name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Type check · Test · Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm compile

      - name: Unit tests
        run: pnpm test

      - name: Build (Chrome MV3)
        run: pnpm build

      - name: Build (Firefox MV2)
        run: pnpm build:firefox

      - name: Upload unpacked Chrome build
        uses: actions/upload-artifact@v4
        with:
          name: chrome-unpacked
          path: dist/chrome-mv3
          retention-days: 14
          if-no-files-found: error
